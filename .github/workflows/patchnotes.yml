name: Patchnotes aktualisieren

on:
  schedule:
    - cron: "17 * * * *"   # stündlich
  workflow_dispatch:        # manuell über den Actions-Tab

permissions:
  contents: write

concurrency:
  group: patchnotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feed holen und übersetzen
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python tools/update_patchnotes.py

      - name: Änderungen committen
        run: |
          if [ -z "$(git status --porcelain -- data/patchnotes.json)" ]; then
            echo "Nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/patchnotes.json
          git commit -m "Patchnotes von foreverchanges.pro aktualisiert"
          git push
